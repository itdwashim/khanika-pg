<style>
:root{--or:#fca311;--nv:#14213d;--bg:#fff8e8;--ln:#f1d9a0;--ok:#2f7d57;--bad:#c0392b}
*{box-sizing:border-box}body{margin:0;font:15px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--nv);background:var(--bg)}
a{color:inherit}header{position:sticky;top:0;z-index:5;background:var(--nv);color:#fff;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:10px 18px}
header b{font:700 17px Georgia,serif;letter-spacing:.04em;color:var(--or)}nav a{color:#fff;text-decoration:none;margin-left:14px;font-size:14px}nav a:hover{color:var(--or)}
section{max-width:1000px;margin:0 auto;padding:30px 18px}h2{font:700 26px Georgia,serif;margin:0 0 14px}
.hero{background:var(--or);padding:34px 18px}.hero>div{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:center}
.hero h1{font:800 clamp(30px,5vw,48px)/1.1 system-ui;margin:0 0 10px}.hero img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.hero.noimg>div{grid-template-columns:1fr}.hero.noimg img{display:none!important}
#rtab.hr .cr,#rtab.ha .ca{display:none}
.btn{display:inline-block;border:0;border-radius:10px;padding:11px 18px;font:600 15px system-ui;cursor:pointer;text-decoration:none;background:var(--nv);color:#fff}.btn.o{background:var(--or);color:var(--nv)}.btn.w{background:#fff;color:var(--nv)}.btn.s{padding:6px 11px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.chip{background:var(--nv);color:#fff;border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}th{background:var(--nv);color:#fff;text-align:left;padding:9px 12px;font-size:13px}td{padding:9px 12px;border-top:1px solid var(--ln)}.tw{overflow-x:auto;border-radius:12px;border:1px solid var(--ln)}
.tag{display:inline-block;border-radius:6px;padding:2px 9px;font-size:12px;font-weight:700}.av{background:#d6f0e0;color:var(--ok)}.fu{background:#fbdcd8;color:var(--bad)}.pn{background:#fff0c2;color:#9a6b00}.pd{background:#d6f0e0;color:var(--ok)}.pa{background:#e5dcfb;color:#6a3fb8}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.gal figure{margin:0;cursor:zoom-in;background:#fff;border-radius:12px;overflow:hidden;border:1px solid var(--ln)}.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}.gal figcaption{padding:6px 10px;font-size:13px}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}#lb img{max-width:100%;max-height:90vh;border-radius:8px}
.card{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:18px;margin-bottom:16px}fieldset{border:1px solid var(--ln);border-radius:12px;margin:0 0 14px;padding:12px 14px;background:#fff}legend{font-weight:700;padding:0 6px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}.w{grid-column:1/-1}label{display:block;font-size:13px;color:#555}label i{color:var(--bad);font-style:normal}
input,select,textarea{width:100%;margin-top:3px;padding:10px;border:1px solid #d7c79a;border-radius:8px;font:inherit;background:#fff;color:var(--nv)}textarea{min-height:80px}
.err{color:var(--bad);font-weight:600;margin:8px 0}.okm{color:var(--ok);font-weight:600}.mut{color:#6b6b6b;font-size:13px}.ck{display:flex;gap:8px;align-items:flex-start;margin-top:8px;font-size:14px;color:var(--nv)}.ck input{width:auto;margin:3px 0 0}
.md{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:18px;z-index:30}.md>div{background:#fff;border-radius:14px;padding:18px;width:100%;max-width:440px}
footer{background:var(--nv);color:#ddd;text-align:center;padding:22px 14px;font-size:14px}
@media(max-width:700px){.hero>div{grid-template-columns:1fr}.g{grid-template-columns:1fr}nav a{margin-left:9px;font-size:13px}}
#nt{display:none;background:#fff3cd;color:#14213d;font-weight:600;border-bottom:1px solid var(--ln);overflow:hidden;white-space:nowrap;padding:9px 0}
#nt span{display:inline-block;padding-left:100%;animation:ntscroll 20s linear infinite}
#nt:hover span{animation-play-state:paused}
@keyframes ntscroll{from{transform:translateX(0)}to{transform:translateX(-100%)}}
@media(prefers-reduced-motion:reduce){#nt{white-space:normal;text-align:center;padding:9px 14px}#nt span{animation:none;padding-left:0}}
.cl{background:#fdecea;border:1px solid #f5c6c0;border-radius:12px;padding:16px;font-weight:600}
</style>

fd=s=>/^\d{4}-\d{2}-\d{2}/.test(s||'')?s.slice(8,10)+'-'+s.slice(5,7)+'-'+s.slice(0,4):(s||''),
mt=m=>/^\d{4}-\d{2}$/.test(m||'')?new Date(m+'-01T00:00:00').toLocaleString('en-US',{month:'long'})+', '+m.slice(0,4):(m||'');
const THEMES={cream:['#fff8e8','#fca311','#14213d','#f1d9a0'],white:['#ffffff','#fca311','#14213d','#e6e6e6'],sky:['#eef6ff','#2f80ed','#0b2545','#cfe3fb'],mint:['#effaf3','#27ae60','#0d3b2e','#c9ecd6'],rose:['#fff1f3','#e85d75','#4a1a2c','#f6ccd4'],lavender:['#f5f1ff','#7c5cff','#2a1b5c','#ded4fb'],sand:['#f7f3ec','#c68b2f','#2f2a22','#e3d9c6'],slate:['#f1f3f6','#f59e0b','#1f2937','#d7dbe2']};
const shade=(h,f)=>'#'+[1,3,5].map(i=>Math.max(0,Math.min(255,Math.round(parseInt(h.slice(i,i+2),16)*(1+f)))).toString(16).padStart(2,'0')).join('');
function applyTheme(c){let[bg,or,nv,ln]=THEMES[c.theme]||THEMES.cream;if(c.theme=='custom'){if(c.themeBg){bg=c.themeBg;ln=shade(bg,-.1)}if(c.themeAccent)or=c.themeAccent}const r=document.documentElement.style;r.setProperty('--bg',bg);r.setProperty('--or',or);r.setProperty('--nv',nv);r.setProperty('--ln',ln)}
const saveTheme=()=>{try{localStorage.setItem('kh-site-theme',JSON.stringify({theme:C.theme,themeBg:C.themeBg,themeAccent:C.themeAccent}))}catch(e){}};
const loadTheme=()=>{try{const t=JSON.parse(localStorage.getItem('kh-site-theme')||'null');if(t)applyTheme(t)}catch(e){}};
let C={},GAL=IMG.gal;
const gal=()=>{$('#gal').innerHTML=GAL.map((g,i)=>`<figure onclick="lb(${i})"><img src="${g.t||g.s}" alt="${esc(g.c)}"><figcaption>${esc(g.c)}</figcaption></figure>`).join('')};
async function init(){
 loadTheme();gal();
 try{C=await run('getPublic')}catch(e){$('#appbox').innerHTML='<p class=err>Could not load the page data: '+esc(em(e))+'</p>';return}
 applyTheme(C);saveTheme();
 document.title=C.name;$('#hn').textContent=C.name;$('#tag').textContent=C.tagline||'';$('#addr').textContent=C.address||'';
 $('#starts').textContent=(C.startingRent&&C.showRent!==false)?'Starting at Rs. '+num(C.startingRent)+' per month':'';$('#about-t').textContent=C.about||'';
 $('#am').innerHTML=C.amenities.map(a=>`<span class=chip>${esc(a)}</span>`).join('');
 const ph=(C.phone||'').replace(/\D/g,'');$('#call').href='https://wa.me/'+(ph.length==10?'91'+ph:ph);$('#call').textContent='WhatsApp '+C.phone;
 $('#foot').innerHTML=esc(C.name)+' &middot; '+esc(C.address)+' &middot; Call/WhatsApp '+esc(C.phone)+(C.email?' &middot; <a href="mailto:'+esc(C.email)+'">'+esc(C.email)+'</a>':'')+(/^https:\/\//.test(C.mapUrl||'')?' &middot; <a href="'+esc(C.mapUrl)+'" target="_blank" rel="noopener">Find us on the map</a>':'');
 if(C.notice){const n=$('#nt');n.innerHTML='<span></span>';const sp=n.firstChild;sp.textContent=C.notice;n.style.display='block';sp.style.animationDuration=Math.max(10,sp.offsetWidth/80)+'s'}
 if(C.gallery&&C.gallery.length){GAL=C.gallery;gal()}
 {const ai=$('#adimg'),hero=document.querySelector('.hero');if(C.flyer){ai.onerror=()=>{ai.style.display='none';hero.classList.add('noimg')};ai.onload=()=>{ai.style.display='block';hero.classList.remove('noimg')};ai.src=C.flyer}}
 $('#rt').innerHTML=C.rooms.length?C.rooms.map(r=>{const v=+r['Vacant Beds'];return `<tr><td>${esc(r.Room)}</td><td>${esc(r.Floor)}</td><td class=cr>Rs. ${num(r['Rent (Rs/month)'])}</td><td class=ca>${isNaN(v)?'<span class=mut>Call to check</span>':v>0?`<span class="tag av">${v} bed${v>1?'s':''} available</span>`:'<span class="tag fu">Full</span>'}</td></tr>`}).join(''):'<tr><td colspan=4>Please call us for availability.</td></tr>';
 $('#rn').textContent=C.showAvail===false?'':'Availability is updated by the PG office and may change during the day.';
 $('#rtab').classList.toggle('hr',C.showRent===false);$('#rtab').classList.toggle('ha',C.showAvail===false);
 if(C.showRooms===false){$('#rooms').style.display='none';$('#nr').style.display='none'}
 form();
 const pu=window.PORTAL_URL||C.portalUrl||'portal.html';['#pl','#pl2'].forEach(q=>{const a=$(q);a.href=pu;if(!window.PORTAL_URL)a.target='_top'});
 if(C.admissions=='closed'){$('#appbox').innerHTML='<div class="cl">Admissions are closed right now. Please call or WhatsApp '+esc(C.phone)+' to ask about the next vacancy.</div>';document.querySelectorAll('a.btn[href="#apply"]').forEach(a=>a.style.display='none')}
}
function lb(i){$('#lb img').src=GAL[i].s;$('#lb').style.display='flex'}
// ---- compressed file reader
const rd=f=>new Promise(res=>{const r=new FileReader;r.onload=()=>{if(f.type.startsWith('image/')){const im=new Image;im.onload=()=>{const k=Math.min(1,700/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res({n:f.name.replace(/\.\w+$/,'')+'.jpg',d:c.toDataURL('image/jpeg',.6)})};im.onerror=()=>res(null);im.src=r.result}else if(f.type=='application/pdf'&&f.size<=500000)res({n:f.name,d:r.result});else res(null)};r.readAsDataURL(f)});
// ---- admission form
const FLD=[['Personal Details',[['name','Full Name','text',1],['phone','Mobile Number (10 digits)','tel',1],['alt','Alternate Mobile','tel'],['email','Email','email'],['dob','Date of Birth','date',1],['blood','Blood Group','sel:A+,A-,B+,B-,AB+,AB-,O+,O-'],['nation','Nationality','text'],['perm','Permanent Address','area',1]]],
['Father / Local Guardian',[['father',"Father's Name",'text',1],['fphone',"Father's Mobile",'tel',1],['focc',"Father's Occupation",'text'],['guard','Local Guardian Name','text'],['gphone','Local Guardian Mobile','tel'],['addr','Local Address','area']]],
['Course and Joining',[['course','Course Studying','text'],['inst','Name of Institution','text'],['pref','Preferred Room','pref'],['moveIn','Expected Joining Date','date',1]]],
['Documents (photo or PDF up to 500 KB each)',[['pid','Passport-size Photo','file',1],['idp','Student ID Proof','file'],['aprf','Address Proof','file'],['pvrd','PVR Document','file']]]];
const DECL='I hereby declare that the information furnished above is true and correct to the best of my knowledge. I agree to abide by the rules and regulations of the hostel, to pay rent and other charges on time, and to take care of hostel property. I understand that the management may terminate my stay for any violation.';
function fld([k,l,t,q]){if(k=='pref'&&C.showRooms===false)return '';const R=q?' required':'',L=`<label class="${t=='area'?'w':''}">${l}${q?' <i>*</i>':''}`;
 if(t=='area')return `${L}<textarea name=${k}${R}></textarea></label>`;if(t=='file')return `${L}<input type=file name=${k} accept="image/*,.pdf"${R}></label>`;
 if(t=='date')return `${L}<input name=${k} data-d=1 inputmode=numeric placeholder=dd-mm-yyyy maxlength=10 pattern="[0-9]{2}-[0-9]{2}-[0-9]{4}"${R} oninput="this.value=this.value.replace(/[^0-9]/g,'').replace(/^([0-9]{2})([0-9])/,'$1-$2').replace(/^([0-9]{2}-[0-9]{2})([0-9])/,'$1-$2').slice(0,10)"></label>`;
 if(t=='pref')return `${L}<select name=${k}><option value="">No preference</option>${C.rooms.map(r=>`<option>${esc(r.Room)}</option>`).join('')}</select></label>`;
 if(t.startsWith('sel'))return `${L}<select name=${k}><option value="">Select</option>${t.slice(4).split(',').map(x=>`<option>${x}</option>`).join('')}</select></label>`;
 return `${L}<input name=${k} type=${t}${R}></label>`}
function form(){$('#appbox').innerHTML=`<form id=af novalidate>`+FLD.map(([t,f])=>`<fieldset><legend>${t}</legend><div class=g>${f.map(fld).join('')}</div></fieldset>`).join('')+`<fieldset><legend>Declaration</legend><p class=mut>${esc(DECL)}</p><label class=ck><input type=checkbox name=agree required> I have read and agree to the above declaration</label></fieldset><div class=err id=ae></div><button class="btn o">Submit Admission Form</button></form>`;
 $('#af').onsubmit=async e=>{e.preventDefault();const f=e.target,er=$('#ae');er.textContent='';if(!f.checkValidity()){f.reportValidity();return}
  const d={files:{}};for(const [,fs] of FLD)for(const [k,l,t] of fs){const el=f.elements[k];if(!el){d[k]='';continue}if(t=='file'){const x=el.files[0];if(x){const a=await rd(x);if(!a){er.textContent=l+': attach an image, or a PDF under 500 KB.';return}d.files[k]=a}}else if(t=='date'){const m=el.value.match(/^(\d\d)-(\d\d)-(\d{4})$/);d[k]=m?m[3]+'-'+m[2]+'-'+m[1]:''}else d[k]=el.value.trim()}
  d.agree=f.elements.agree.checked;const b=f.querySelector('button');b.disabled=true;b.textContent='Submitting...';
  try{const r=await run('submitAdmission',d);done(r,d.name)}catch(x){er.textContent=em(x);b.disabled=false;b.textContent='Submit Admission Form'}}}
function upi(p,amt,note){return 'upi://pay?pa='+encodeURIComponent(p.upi)+'&pn='+encodeURIComponent(p.payee||'')+(amt?'&am='+amt:'')+'&cu=INR&tn='+encodeURIComponent(note)}
function qr(t){const q=qrcode(0,'M');q.addData(t);q.make();return q.createSvgTag({cellSize:Math.max(2,Math.floor(180/q.getModuleCount())),margin:2})}
function done(r,name){const p=r.pay;$('#appbox').innerHTML=`<div class=card><h3 style="margin-top:0" class=okm>Application received</h3><p>Thank you, <b>${esc(name)}</b>. Your reference number is <b>${esc(r.ref)}</b>. The PG office will contact you on your mobile to confirm your room.</p>${p?`<h4>Book your bed online</h4><p>${p.advance?'Booking amount: <b>Rs. '+num(p.advance)+'</b>. ':''}Pay by UPI, then enter the UPI reference number so the office can verify it.</p><div style="display:flex;gap:18px;flex-wrap:wrap;align-items:center"><div style="background:#fff;padding:6px;border:1px solid var(--ln)">${qr(upi(p,p.advance,'Booking '+r.ref))}</div><div><a class="btn o" href="${esc(upi(p,p.advance,'Booking '+r.ref))}" target="_top">Pay with UPI app</a><p class=mut>UPI ID: ${esc(p.upi)} (${esc(p.payee)})</p></div></div><label style="margin-top:12px">UPI reference / UTR number<input id=bu></label><div class=err id=be></div><button class="btn" onclick="claimB('${esc(r.ref)}','${esc(p.advance||'')}')">I have paid</button>`:'<p class=mut>Online payment is not enabled yet. Please pay at the PG office.</p>'}</div>`;location.hash='#apply'}
async function claimB(ref,amt){try{await run('claimBooking',ref,$('#bu').value,amt);$('#be').className='okm';$('#be').textContent='Thank you. We will verify your payment and confirm your booking.'}catch(e){$('#be').className='err';$('#be').textContent=em(e)}}
// ---- student portal
init();
</script></body></html>
