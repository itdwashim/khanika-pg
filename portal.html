let KIT=null,ENGF=null,ENGP=null;const ENGCB={};
function engineLoad(){
  if(ENGP)return ENGP;

      const m=ev.data;if(!m||typeof m!=='object')return;
      if(m.k==='khready'){clearTimeout(to);ENGF=f;res(f)}
      else if(m.k==='khrcpt'&&ENGCB[m.id]){const c=ENGCB[m.id];delete ENGCB[m.id];m.err?c.rej(new Error(m.err)):c.res(m.blob)}
    });

  });

const cropPh=u=>new Promise(res=>{const im=new Image();setTimeout(()=>res(null),4000);im.onerror=()=>res(null);im.onload=()=>{try{const R=21.5/27.4,iw=im.width,ih=im.height;let sw=iw,sh=iw/R;if(sh>ih){sh=ih;sw=ih*R}const c=document.createElement('canvas');c.width=360;c.height=Math.round(360/R);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,(iw-sw)/2,(ih-sh)/2,sw,sh,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.9))}catch(e){res(null)}};im.src=u});
async function cardPdf(kit,tc,nm,ad,rows,bits){
  try{
    const cp=PH?await cropPh(PH):null;
    const {jsPDF}=window.jspdf,W=CW,H=CH,d=new jsPDF({unit:'mm',format:[W,H],orientation:'landscape'});
    d.setFillColor(...tc.page).rect(0,0,W,H,'F');d.setFillColor(...tc.band).rect(0,0,W,15,'F');d.setFillColor(...tc.acc).rect(0,15,W,1.2,'F');
    let x=4;

    d.setTextColor(255,255,255).setFont('helvetica','bold').setFontSize(9.5);d.text(d.splitTextToSize(nm,W-x-3).slice(0,1),x,6.4);
    d.setFont('helvetica','normal').setFontSize(5.2);d.text(d.splitTextToSize(ad,W-x-3).slice(0,3),x,9.6);

    else{d.setTextColor(255,255,255).setFont('helvetica','bold').setFontSize(20).text(String(ME.name||'?').trim().charAt(0).toUpperCase(),px+pw/2,py+ph/2+3,{align:'center'})}
    const tx=29.5,aw=W-tx-3;let y=19.4;
    rows.forEach((r,i)=>{d.setFont('helvetica','normal').setFontSize(4.3).setTextColor(110,110,110).text(String(r[0]).toUpperCase(),tx,y);
      d.setFont('helvetica','bold').setTextColor(30,30,30);let v=String(r[1]||'-'),fs=7.2,lines;

    d.save('Photo-Card-'+String(ME.sid||'student').replace(/[^A-Za-z0-9_-]/g,'')+'.pdf');
  }catch(e){alert('Could not make the photo card: '+(e.message||e))}
}
